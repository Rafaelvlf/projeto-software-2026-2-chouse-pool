version: '3.8'

services:
  poll-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chouse-pool
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://poll-db:5432/chouse_polls
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
    depends_on:
      poll-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  poll-db:
    image: postgres:17-alpine
    container_name: chouse-poll-db
    environment:
      POSTGRES_DB: chouse_polls
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chouse_polls"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: chouse-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

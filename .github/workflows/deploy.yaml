name: Java CI with Maven

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml



    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: "rafaelvlf"
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: rafaelvlf/chouse-pool:${{ github.sha }}


    - name: executing remote ssh commands using password
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_TEST }}
        username: "ubuntu"
        key: ${{ secrets.KEY_TEST }}
        port: 22
        script: |
          (
            flock -x -w 300 200
            docker network create chouse-net 2>/dev/null || true
            docker stop chouse-pool 2>/dev/null || true
            docker rm --force chouse-pool 2>/dev/null || true
            docker run -d \
              --name chouse-pool \
              --network chouse-net \
              --restart unless-stopped \
              -p 8081:8080 \
              -e DATABASE_URL=jdbc:postgresql://chouse-poll-db:5432/chouse_polls \
              -e DATABASE_USERNAME=postgres \
              -e DATABASE_PASSWORD=postgres \
              -e RABBITMQ_HOST=chouse-rabbitmq \
              -e RABBITMQ_PORT=5672 \
              -e RABBITMQ_USERNAME=guest \
              -e RABBITMQ_PASSWORD=guest \
              rafaelvlf/chouse-pool:${{ github.sha }}
            docker image prune -a -f
          ) 200>/tmp/chouse-deploy.lock